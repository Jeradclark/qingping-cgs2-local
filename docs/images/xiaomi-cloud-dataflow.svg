<svg width="680" height="632" viewBox="0 0 680 632" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title>Qingping device to Xiaomi miio cloud, observed data flow</title>
<desc>Six-step flow from factory-stored credentials through a plaintext server lookup to an encrypted TLS session whose contents remain unknown.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="205" y="40" width="270" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">vendor_storage</text>
<text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">factory-programmed storage</text>
<line x1="340" y1="96" x2="340" y2="136" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="205" y="136" width="270" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="154" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">device.conf</text>
<text x="340" y="172" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">did, model, key, mac</text>
<line x1="340" y1="192" x2="340" y2="232" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="205" y="232" width="270" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="340" y="250" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">gslb lookup (dns.io.mi.com)</text>
<text x="340" y="268" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">id + model sent in the clear</text>
<line x1="340" y1="288" x2="340" y2="328" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="205" y="328" width="270" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="346" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">host_list response</text>
<text x="340" y="364" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">3 rotating ip addresses</text>
<line x1="340" y1="384" x2="340" y2="424" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="205" y="424" width="270" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="340" y="442" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">TLS 1.2 handshake</text>
<text x="340" y="460" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">device id sent in the clear</text>
<line x1="340" y1="480" x2="340" y2="520" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="205" y="520" width="270" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" stroke-dasharray="4 3"/>
<text x="340" y="538" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">encrypted session</text>
<text x="340" y="556" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">contents not recovered</text>

<rect x="106" y="600" width="14" height="14" rx="3" fill="#B4B2A9"/>
<text x="126" y="607" dominant-baseline="central" font-size="12" fill="#444441">on device</text>
<rect x="213" y="600" width="14" height="14" rx="3" fill="#F0997B"/>
<text x="233" y="607" dominant-baseline="central" font-size="12" fill="#444441">sent in the clear</text>
<rect x="383" y="600" width="14" height="14" rx="3" fill="#AFA9EC" stroke="#534AB7" stroke-width="1" stroke-dasharray="3 2"/>
<text x="403" y="607" dominant-baseline="central" font-size="12" fill="#444441">encrypted, unconfirmed</text>
</svg>
